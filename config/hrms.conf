# ==============================================================================
# Lightweight HRMS Configuration File
# ==============================================================================

# Database storage path
database_path=data/hrms.db

# Application logging path
log_path=logs/hrms.log

# Log level: DEBUG, INFO, WARNING, ERROR
log_level=INFO

# User session timeout in seconds (e.g. 1800 = 30 minutes)
session_timeout=1800

# Enable x86-64 Assembly optimizations if available (true/false)
enable_assembly=true

# Work hours and attendance rules
standard_work_hours=8
work_start_time=09:30
work_end_time=17:30
late_grace_minutes=15

# Currency symbol for display (internal storage is always integer paise)
currency_symbol=₹
